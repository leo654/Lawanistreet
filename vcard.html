        var theme = "dark";

          var storedTheme = localStorage.getItem("ll-theme");
          theme = storedTheme === "light" || storedTheme === "dark"

    <style>
      .vcard-background {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 16%, rgba(244, 242, 236, 0.08), transparent 34%),
          radial-gradient(circle at 84% 82%, rgba(244, 75, 24, 0.07), transparent 32%),
          linear-gradient(135deg, #171a18 0%, #0b0d0c 54%, #070807 100%);
        pointer-events: none;
      }

      body.ll-contact-page {
        background: #070807;
      }

      .project-form-wrapper {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
        position: relative;
        z-index: 2;
      }

      .project-form {
        --project-control-height: 76px;
        --project-control-width: calc((100% - 32px) / 3);
        --project-form-gap: clamp(22px, 3vw, 32px);
        --ll-white: #f4f2ec;
        --ll-ink: #070807;
        --ll-light-muted: rgba(244, 242, 236, 0.72);
        --ll-dark-muted: rgba(244, 242, 236, 0.56);
        --ll-light-line: rgba(244, 242, 236, 0.32);
        --ll-dark-line: rgba(244, 242, 236, 0.28);
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        color: #f4f2ec;
        color-scheme: dark;
      }

      .project-form__step {
        display: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }

      .project-form__step.active {
        display: grid;
        row-gap: var(--project-form-gap);
        opacity: 1;
        transform: translateY(0);
      }

      .project-form__question {
        font-size: clamp(24px, 4vw, 36px);
        line-height: 1.2;
        margin: 0;
        font-family: var(--ll-sans);
        font-weight: 400;
        color: #f4f2ec;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }

      .project-form__options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        grid-auto-rows: var(--project-control-height);
        align-items: stretch;
        gap: 16px;
        margin: 0;
      }

      .project-form__option {
        appearance: none;
        display: flex;
        width: 100%;
        height: 100%;
        min-height: var(--project-control-height);
        align-items: center;
        justify-content: flex-start;
        background: rgba(244, 242, 236, 0.025);
        border: 1px solid rgba(244, 242, 236, 0.32);
        color: #f4f2ec;
        padding: 20px 24px;
        font-family: var(--ll-sans);
        font-size: 14px;
        cursor: pointer;
        transition: border-color 0.2s ease, background-color 0.2s ease;
        text-align: left;
        border-radius: 0;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        position: relative;
      }

      .project-form__option:hover {
        border-color: rgba(244, 242, 236, 0.82);
        background-color: rgba(244, 242, 236, 0.1);
      }

      .project-form__option:focus {
        outline: 2px solid var(--ll-white);
        outline-offset: 2px;
      }

      .project-form__option.selected {
        background-color: #f4f2ec;
        color: #070807;
        border-color: #f4f2ec;
      }

      .project-form__option:focus-visible {
        outline: 2px solid var(--ll-orange);
        outline-offset: 2px;
      }

      .project-form__field-group {
        margin: 0;
      }

      .project-form__label {
        display: block;
        font-size: 12px;
        margin-bottom: 8px;
        color: rgba(244, 242, 236, 0.82);
        font-family: var(--ll-mono);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .project-form__input {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(244, 242, 236, 0.36);
        color: #f4f2ec;
        caret-color: var(--ll-orange);
        -webkit-text-fill-color: #f4f2ec;
        padding: 12px 0;
        font-family: var(--ll-sans);
        font-size: 18px;
        transition: border-color 0.2s ease;
        border-radius: 0;
      }

      .project-form__input:focus {
        outline: none;
        border-color: #f4f2ec;
      }

      .project-form__input::placeholder {
        color: rgba(244, 242, 236, 0.56);
        opacity: 1;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }

      .project-form__textarea {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(244, 242, 236, 0.36);
        color: #f4f2ec;
        caret-color: var(--ll-orange);
        -webkit-text-fill-color: #f4f2ec;
        padding: 12px 0;
        font-family: var(--ll-sans);
        font-size: 18px;
        min-height: 120px;
        resize: vertical;
        transition: border-color 0.2s ease;
        border-radius: 0;
      }

      .project-form__textarea:focus {
        outline: none;
        border-color: #f4f2ec;
      }

      .project-form__textarea::placeholder {
        color: rgba(244, 242, 236, 0.56);
        opacity: 1;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }

      .project-form__actions {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        gap: 16px;
        margin: 0;
      }

      .project-form__button {
        appearance: none;
        display: inline-flex;
        width: var(--project-control-width);
        min-width: 200px;
        height: var(--project-control-height);
        min-height: var(--project-control-height);
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 1px solid rgba(244, 242, 236, 0.52);
        color: #f4f2ec;
        padding: 0 24px;
        font-family: var(--ll-sans);
        font-size: 12px;
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease;
        border-radius: 0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .project-form__button:hover {
        background-color: #f4f2ec;
        color: #070807;
      }

      .project-form__button:focus {
        outline: 2px solid var(--ll-white);
        outline-offset: 2px;
      }

      .project-form__button:focus-visible {
        outline: 2px solid var(--ll-orange);
        outline-offset: 2px;
      }

      .project-form__button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      .project-form[data-state="success"] .project-form__button:disabled {
        cursor: default;
        opacity: 1;
      }

      .project-form__button--secondary {
        border-color: rgba(244, 242, 236, 0.28);
      }

      .project-form__button--secondary:hover {
        background-color: rgba(244, 242, 236, 0.1);
        color: #f4f2ec;
      }

      .project-form__back {
        background: none;
        border: none;
        color: rgba(244, 242, 236, 0.72);
        padding: 8px 0;
        cursor: pointer;
        font-family: var(--ll-mono);
        font-size: 12px;
        margin: 0;
        transition: color 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .project-form__back:hover {
        color: #f4f2ec;
      }

      .project-form__back:focus {
        outline: 2px solid var(--ll-white);
        outline-offset: 2px;
      }

      .project-form__back:focus-visible {
        outline: 2px solid var(--ll-orange);
        outline-offset: 2px;
      }

      .project-form__validation {
        color: var(--ll-orange);
        font-family: var(--ll-mono);
        font-size: 12px;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .project-form__summary {
        margin: 0;
        padding: 16px 0;
        border-bottom: 1px solid rgba(244, 242, 236, 0.28);
      }

      .project-form__summary-label {
        font-family: var(--ll-mono);
        font-size: 11px;
        color: rgba(244, 242, 236, 0.72);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }

      .project-form__summary-value {
        font-family: var(--ll-sans);
        font-size: 14px;
        color: #f4f2ec;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }

      .project-form__other-field {
        margin: 0;
        padding: 0;
      }

      .project-form__honeypot {
        position: absolute;
        left: -10000px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      .project-form__status {
        min-height: 20px;
        margin: 0;
        color: rgba(244, 242, 236, 0.72);
        font-family: var(--ll-mono);
        font-size: 12px;
        line-height: 1.5;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .project-form__status[data-state="pending"] {
        color: var(--ll-white);
      }

      .project-form__status[data-state="success"] {
        color: #b9f6ca;
      }

      .project-form__status[data-state="error"] {
        color: var(--ll-orange);
      }

      .project-form__status a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      @media (max-width: 768px) {
        .project-form {
          --project-control-height: 68px;
          --project-control-width: 100%;
        }

        .project-form-wrapper {
          padding: 20px 16px;
          place-items: start;
          padding-top: 80px;
        }

        .project-form__options {
          grid-template-columns: 1fr;
          grid-auto-rows: var(--project-control-height);
        }

        .project-form__option {
          min-height: var(--project-control-height);
        }

        .project-form__actions {
          flex-direction: column;
        }

        .project-form__button {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>

    <script>
      (function() {
        'use strict';
        
        const form = document.getElementById('projectForm');
        const steps = form.querySelectorAll('.project-form__step');
        const projectTypesInput = document.getElementById('projectTypes');
        const otherField = document.getElementById('otherField');
        const otherSpecify = document.getElementById('otherSpecify');
        const step1Validation = document.getElementById('step1Validation');
        const summaryValue = document.getElementById('summaryValue');
        const submitButton = form.querySelector('[data-submit-button]');
        const formStatus = form.querySelector('[data-form-status]');
        const recipient = 'talktolawanistreet@gmail.com';
        let currentStep = 1;
        
        // Multi-select data model
        const selectedProjectTypes = new Set();
        
        // Project type labels for display
        const projectTypeLabels = {
          'brand-identity': 'BRAND IDENTITY',
          'website': 'WEBSITE',
          'campaign': 'CAMPAIGN',
          'product': 'PRODUCT',
          'creative-direction': 'CREATIVE DIRECTION',
          'other': 'SOMETHING ELSE'
        };
        
        // Step 1: Multi-select project type options
        const optionButtons = form.querySelectorAll('.project-form__option');
        optionButtons.forEach(button => {
          button.addEventListener('click', function() {
            const value = this.dataset.value;
            
            // Toggle selection
            if (selectedProjectTypes.has(value)) {
              selectedProjectTypes.delete(value);
              this.classList.remove('selected');
              this.setAttribute('aria-pressed', 'false');
            } else {
              selectedProjectTypes.add(value);
              this.classList.add('selected');
              this.setAttribute('aria-pressed', 'true');
            }
            
            // Show/hide "Please specify" field for "Something Else"
            if (selectedProjectTypes.has('other')) {
              otherField.style.display = 'block';
              otherSpecify.required = true;
            } else {
              otherField.style.display = 'none';
              otherSpecify.required = false;
              otherSpecify.value = '';
              otherSpecify.removeAttribute('aria-invalid');
              otherSpecify.style.borderColor = '';
            }
            
            // Clear validation when selection changes
            step1Validation.style.display = 'none';
            
            // Update hidden input
            projectTypesInput.value = Array.from(selectedProjectTypes).join(',');
          });
        });
        
        // Navigation
        form.addEventListener('click', function(e) {
          const nextButton = e.target.closest('[data-next]');
          const backButton = e.target.closest('[data-back]');
          
          if (nextButton) {
            const targetStep = parseInt(nextButton.dataset.next);
            if (validateStep(currentStep)) {
              goToStep(targetStep);
            }
          }
          
          if (backButton) {
            const targetStep = parseInt(backButton.dataset.back);
            goToStep(targetStep);
          }
        });
        
        function goToStep(stepNumber) {
          const currentStepEl = form.querySelector(`[data-step="${currentStep}"]`);
          const nextStepEl = form.querySelector(`[data-step="${stepNumber}"]`);
          
          if (currentStepEl && nextStepEl) {
            currentStepEl.classList.remove('active');
            nextStepEl.classList.add('active');
            currentStep = stepNumber;

            // Update summary when entering step 3
            if (stepNumber === 3) {
              updateSummary();
            }

            // Move focus after layout settles without creating a blank frame.
            const firstInput = nextStepEl.querySelector('input, textarea');
            if (firstInput) {
              requestAnimationFrame(() => firstInput.focus({ preventScroll: true }));
            }
          }
        }
        
        function updateSummary() {
          const labels = Array.from(selectedProjectTypes).map(value => projectTypeLabels[value]);
          summaryValue.textContent = labels.join(' / ');
        }
        
        function validateStep(stepNumber) {
          const stepEl = form.querySelector(`[data-step="${stepNumber}"]`);
          let isValid = true;
          let firstInvalidInput = null;
          
          // Step 1: Validate at least one project type selected
          if (stepNumber === 1) {
            if (selectedProjectTypes.size === 0) {
              isValid = false;
              step1Validation.textContent = 'SELECT AT LEAST ONE OPTION';
              step1Validation.style.display = 'block';
            } else if (selectedProjectTypes.has('other') && !otherSpecify.value.trim()) {
              isValid = false;
              firstInvalidInput = otherSpecify;
              otherSpecify.setAttribute('aria-invalid', 'true');
              otherSpecify.style.borderColor = 'var(--ll-orange)';
              step1Validation.textContent = 'PLEASE SPECIFY WHAT YOU NEED';
              step1Validation.style.display = 'block';
            } else {
              step1Validation.style.display = 'none';
            }
          }
          
          // Steps 2 and 3: Validate required inputs
          const requiredInputs = stepEl.querySelectorAll('input[required], textarea[required]');
          requiredInputs.forEach(input => {
            if (!input.value.trim() || !input.checkValidity()) {
              isValid = false;
              if (!firstInvalidInput) firstInvalidInput = input;
              input.setAttribute('aria-invalid', 'true');
              input.style.borderColor = 'var(--ll-orange)';
            } else {
              input.setAttribute('aria-invalid', 'false');
              input.style.borderColor = '';
            }
          });

          if (firstInvalidInput) {
            firstInvalidInput.focus();
            firstInvalidInput.reportValidity();
          }
          
          return isValid;
        }
        
        // Form submission
        form.addEventListener('submit', async function(e) {
          e.preventDefault();

          if (form.dataset.state === 'success') return;
          
          if (validateStep(currentStep)) {
            const formData = new FormData(form);
            
            // Build project types string
            const projectTypes = Array.from(selectedProjectTypes).map(value => projectTypeLabels[value]);
            const projectTypesString = projectTypes.join(', ');
            
            // Build email body
            let body = 'PROJECT TYPE:\n' + projectTypesString + '\n\n';
            body += 'NAME:\n' + formData.get('name') + '\n\n';
            body += 'EMAIL:\n' + formData.get('email') + '\n\n';
            body += 'COMPANY:\n' + (formData.get('company') || 'N/A') + '\n\n';
            
            // Add "Other service" if specified
            if (selectedProjectTypes.has('other') && formData.get('otherSpecify')) {
              body += 'OTHER SERVICE:\n' + formData.get('otherSpecify') + '\n\n';
            }
            
            body += 'PROJECT:\n' + formData.get('projectDescription');
            
            const subject = encodeURIComponent('Start a project: ' + projectTypesString);
            const mailtoUrl = 'mailto:' + recipient + '?subject=' + subject + '&body=' + encodeURIComponent(body);

            formData.set('projectTypes', projectTypesString);
            formData.set('message', body);

            if (window.location.protocol === 'file:') {
              window.location.href = mailtoUrl;
              return;
            }

            submitButton.disabled = true;
            submitButton.setAttribute('aria-busy', 'true');
            submitButton.textContent = 'SENDING...';
            setFormStatus('pending', 'SENDING YOUR PROJECT REQUEST...');

            try {
              const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                  'Accept': 'application/json',
                  'X-Requested-With': 'XMLHttpRequest'
                },
                credentials: 'same-origin'
              });
              const responseText = await response.text();
              let data = null;

              try {
                data = responseText ? JSON.parse(responseText) : null;
              } catch (error) {}

              if (!response.ok || !data || data.ok !== true) {
                throw new Error(data && data.error ? data.error : 'Unable to send automatically.');
              }

              form.dataset.state = 'success';
              submitButton.textContent = 'PROJECT SENT';
              setFormStatus('success', 'THANKS — YOUR PROJECT REQUEST HAS BEEN SENT.');
            } catch (error) {
              form.dataset.state = 'error';
              submitButton.disabled = false;
              submitButton.textContent = 'TRY AGAIN';
              setFormStatus('error', 'AUTOMATIC SENDING FAILED. ', mailtoUrl);
            } finally {
              submitButton.setAttribute('aria-busy', 'false');
            }
          }
        });

        function setFormStatus(state, message, fallbackUrl) {
          formStatus.dataset.state = state;
          formStatus.replaceChildren(document.createTextNode(message));

          if (fallbackUrl) {
            const link = document.createElement('a');
            link.href = fallbackUrl;
            link.textContent = 'EMAIL ' + recipient + ' DIRECTLY';
            formStatus.appendChild(link);
          }
        }
        
        // Clear validation styles on input
        form.querySelectorAll('input, textarea').forEach(input => {
          input.addEventListener('input', function() {
            this.setAttribute('aria-invalid', 'false');
            this.style.borderColor = '';
            if (formStatus.dataset.state === 'error') {
              setFormStatus('idle', '');
            }
          });
        });
      })();
    </script>
  </body>
</html>
